[package]
name = "natally-ai-studio"
version = "0.3.73753"
description = "Natally Tauri 2 test shell"
authors = ["rebots-online"]
repository = "https://github.com/rebots-online/natally-ai-studio"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "natally_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-log = "2"

[profile.release]
debug = 1
strip = false
